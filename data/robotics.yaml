- name: Jev Reflex Autonomy Lab
  url: https://github.com/khordoo/jev-reflex-autonomy-lab
  kind: repo
  author: khordoo
  description: Multi-drone simulation with up to fifteen drones steered by Jev as a System 1 reflex layer, optionally asking a slower OpenRouter planner for advice when confidence drops.
  description_zh: 多无人机仿真，最多十五架无人机由 Jev 作为 System 1 反射层操控，置信度下降时可以向较慢的 OpenRouter 规划器求助。
