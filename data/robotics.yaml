- name: Crop Steering Jev check
  name_zh: 作物调控灌溉的 Jev 检查
  url: https://github.com/JakeTheRabbit/HA-Irrigation-Strategy
  kind: repo
  author: JakeTheRabbit
  description: Home Assistant crop-steering irrigation controller whose optional Jev check via Cloudflare Workers AI can veto auto-setpoint changes that look like probe or delivery faults and nudge P2 shot size in small bounded steps.
  description_zh: Home Assistant 作物调控（crop steering）灌溉控制器，可选的 Jev 检查通过 Cloudflare Workers AI 运行，能否决看似由探头或供水故障引起的自动设定点变更，并以有界的小步调整 P2 灌溉量。
  jev: Consulted when a ramp plateaus and hourly during P2; irrigation never waits on it and no answer means no change.
  jev_zh: 在爬坡进入平台期时以及 P2 阶段每小时咨询一次；灌溉从不等待它，没有答案就不做改动。
