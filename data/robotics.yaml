- name: Adaptive traffic signal simulation
  name_zh: 自适应交通信号灯仿真
  url: https://x.com/nishitkhalpada/status/2101755092177473858
  kind: post
  author: nishitkhalpada
  description: Traffic simulation comparing a fixed 8-second signal cycle with Jev deciding when to keep or switch the green light from queue sizes, wait times and arrivals; fixed timing wins in balanced traffic, Jev in uneven traffic.
