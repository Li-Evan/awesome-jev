entries:
- name: av
  url: https://github.com/PixelML/av
  kind: repo
  author: PixelML
  description: Video memory CLI for agents that indexes captions and transcripts for search and Q&A; with a TypeSafe key, `av ask` has Jev filter and rank retrieved scenes and check whether the answer is supported.
  description_zh: 面向 agent 的视频记忆 CLI，为字幕和转录建立索引，用于搜索和问答；配置 TypeSafe 密钥后，`av ask` 会让 Jev 过滤并排序检索到的场景，并检查答案是否有依据。
  jev: Per-hit relevance probability times retrieval score for ranking, plus a separate Noul on whether the answer is supported; falls back to raw retrieval if Jev fails.
  jev_zh: 排序时用每条命中的相关性概率乘以检索分数，另用一个 Noul 判断答案是否有依据；Jev 失败时回退到原始检索结果。
  metrics:
    stars: 7
  date: '2026-02-14'
  links:
    app: https://agentic.video
  tags:
  - video-rag
  - cli
