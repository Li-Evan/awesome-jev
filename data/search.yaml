  kind: post
  author: zaidmukaddam
  description: In-browser search bar where a 27K-parameter model parses queries like "open bugs from sam since last week" into typed filters in 0.25 ms and asks Jev only about words it is unsure of.
  description_zh: 浏览器内搜索栏：一个 27K 参数的模型在 0.25 毫秒 内把“open bugs from sam since last week”这类查询解析成类型化过滤条件，只在拿不准的词上询问 Jev。
  image: https://pbs.twimg.com/amplify_video_thumb/2100910214530953216/img/pZDYHLcrOl_f0pWI.jpg
