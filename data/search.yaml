- name: Book Learning Jev retrieval gate
  name_zh: Book Learning 的 Jev 检索闸门
  url: https://github.com/Zafer-Liu/book-learning/blob/main/study/jev_gate.py
  kind: repo
  author: Zafer-Liu
  description: 'Retrieval gate in the self-hosted BOOKNOTE textbook RAG study assistant: Jev scores each fused candidate chunk for relevance and screens it for prompt injection before it reaches the answer, failing open to the ungated results.'
  description_zh: 自托管教材 RAG 学习助手 BOOKNOTE 中的检索闸门：在融合后的候选分块进入回答之前，Jev 为每块打相关性分并筛查提示词注入，出错时退回未经过滤的结果。
  jev: One fanned-out call per query with a 0-3 relevance Score and an injection Noul per chunk; keeps chunks with relevance >= 2.0 and injection < 0.5.
  jev_zh: 每个查询一次扇出调用，每个分块一个 0-3 相关性 Score 和一个注入 Noul；保留相关性 >= 2.0 且注入 < 0.5 的分块。
  metrics:
    repo_stars: 43
  date: '2026-04-23'
  links:
    repo: https://github.com/Zafer-Liu/book-learning
  tags:
  - rag
  - filtering
  - education
