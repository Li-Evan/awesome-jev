- name: FindSFSymbols
  url: https://github.com/tornikegomareli/FindSFSymbols
  kind: repo
  author: tornikegomareli
  description: 'Mac app for finding SF Symbols by plain description: on-device word vectors shortlist 48 symbols, then Jev answers 48 yes/no questions in one request and the scores drive a physics pile where good matches float up.'
  description_zh: 用简单描述查找 SF Symbols 的 Mac 应用：设备端词向量先筛出 48 个符号，再由 Jev 在一次请求中回答 48 个是/否问题，分数驱动一个物理堆叠效果，匹配度高的会浮上来。
