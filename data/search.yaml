- name: cascade-search
  url: https://github.com/zaidmukaddam/cascade-search
  kind: repo
  author: zaidmukaddam
  description: 'In-browser search query parser: a 27,193-parameter model labels every word with a role and calibrated confidence in about 0.25 ms, and only the uncertain words are escalated to Jev.'
  description_zh: 浏览器内的搜索查询解析器：一个 27,193 参数的模型在约 0.25 毫秒 内为每个词标注角色和校准置信度，只有不确定的词才升级给 Jev。
  jev: Both tiers feed one compiler so the app gets the same typed filter whichever tier answered; a separate cascade-search-jev package provides the escalation.
  jev_zh: 两层都输出到同一个编译器，所以无论哪一层作答，应用拿到的都是同样的类型化过滤条件；升级功能由单独的 cascade-search-jev 包提供。
  image: https://raw.githubusercontent.com/zaidmukaddam/cascade-search/main/eval/results/m2.png
  metrics:
    stars: 8
  date: '2026-09-17'
  links:
    app: https://cascade.scira.ai
  tags:
  - query-parsing
  - cascade
  - browser
- name: chia1104.dev Jev reranker
  name_zh: chia1104.dev 的 Jev 重排器
  url: https://github.com/Chia1104/chia1104.dev/blob/develop/packages/ai/src/rerank/jev.ts
  kind: repo
  author: Chia1104
  description: 'Search reranker in the chia1104.dev personal site and CMS monorepo that makes one Jev call per query: a Choice over candidate posts and a Noul on whether any candidate actually answers it, working across languages.'
  description_zh: 个人网站与 CMS monorepo chia1104.dev 中的搜索重排器，每个查询只调用一次 Jev：一个在候选文章中挑选的 Choice，加一个判断是否有候选真正回答了查询的 Noul，支持跨语言。
  jev: The Choice picks the best candidate id; the Noul separates a real answer from the closest irrelevant hit, since choice probabilities always sum to 1.
  jev_zh: Choice 选出最佳候选 id；由于 Choice 的概率总和恒为 1，需要 Noul 把真正的答案与最接近但无关的命中区分开。
  image: https://repository-images.githubusercontent.com/485318015/26c450f3-6246-4b7d-b8a5-7a658a79989e
  metrics:
    repo_stars: 32
  date: '2022-04-25'
  links:
    app: https://chia1104.dev
    repo: https://github.com/Chia1104/chia1104.dev
  tags:
  - reranking
  - blog-search
