- name: Keating Jev teaching judge
  name_zh: Keating 的 Jev 教学评委
  url: https://github.com/Diogenesoftoronto/keating/blob/main/scripts/training/benchmark_judge_systemone.py
  kind: repo
  author: Diogenesoftoronto
  description: 'Typed-judgment reviewer for the Keating AI tutor''s teaching rubric: Jev scores each dimension and selects evidence spans enumerated by code, so quotes cannot be invented, plus a harness comparing it with the incumbent LLM judge.'
  description_zh: 针对 AI 导师 Keating 教学评分细则的类型化判断审阅器：Jev 给每个维度打分，并从代码枚举出的片段中选取证据，因此引文无法凭空编造；另附一个 harness，与现役 LLM 评委做对比。
  jev: 'Per rubric dimension: a 0/1/2 Score, a judgeability Noul, a Choice over candidate spans (max 64, narrowed in stages) and a Choice over support values.'
  jev_zh: 每个评分维度包含：一个 0/1/2 的 Score、一个判断可评性的 Noul、一个在候选片段（最多 64 个，分阶段缩小）中选择的 Choice，以及一个在支持程度取值中选择的 Choice。
  metrics:
    repo_stars: 36
  date: '2026-04-01'
  links:
    repo: https://github.com/Diogenesoftoronto/keating
    app: https://keating.help
  tags:
  - tutoring
  - llm-judge
  - evidence
- name: Leximory Jev evaluation
  name_zh: Leximory 的 Jev 评估
  url: https://github.com/NarixHine/leximory/blob/main/apps/leximory/server/ai/evaluate.ts
  kind: repo
  author: NarixHine
  description: Language-learning app for English and Japanese readers that runs Jev through the AI SDK evaluate API, for example to detect whether a looked-up term names a place and what kind.
  description_zh: 面向英语和日语阅读者的语言学习应用，通过 AI SDK 的 evaluate API 运行 Jev，比如判断用户查询的词是不是地名、属于哪类地点。
  jev: A Noul for 'has a location' gated at a threshold plus a Choice for the location kind, billed against the user's monthly quota.
  jev_zh: 一个判断“是否包含地点”的 Noul，经阈值把关，再加一个判断地点类型的 Choice，费用计入用户的月度额度。
  metrics:
    repo_stars: 10
  date: '2024-09-08'
  links:
    app: https://leximory.com
    repo: https://github.com/NarixHine/leximory
  tags:
  - language-learning
  - ai-sdk
  - classification
- name: ReadAloud (dasheng)
  url: https://github.com/wquguru/dasheng
  kind: repo
  author: wquguru
  description: English read-aloud trainer where the R2T2 streaming ASR transcribes your speech, Jev judges whether each mismatched word was misread and how, and code turns those judgments into a score.
  description_zh: 英语朗读训练工具：R2T2 流式 ASR 转写你的朗读，Jev 判断每个对不上的词是否读错、怎么读错的，再由代码把这些判断换算成分数。
  metrics:
    stars: 122
  date: '2026-09-20'
  tags:
  - pronunciation
  - asr
  - language-learning
- name: SkellySpeak Jev assessment study
  name_zh: SkellySpeak 的 Jev 评估研究
  url: https://github.com/freemocap/skellyspeak/tree/main/tools/benchmarks/conversation-prompts/assessment
  kind: repo
  author: freemocap
  description: Benchmark in the SkellySpeak language-learning app that assesses learner messages against 45 coaching skills with Jev and compares it to a dense Gemini control in a 648-request Spanish factorial study with a dedicated dashboard.
  description_zh: 语言学习应用 SkellySpeak 中的基准测试：用 Jev 按 45 项辅导技能评估学习者的消息，并在一项 648 次请求的西班牙语析因研究中与 dense 模式的 Gemini 对照组比较，配有专门的看板。
  jev: 45 independent Choice questions per learner message over five coaching-outcome labels, plus a binary Noul arm with 90 questions.
  jev_zh: 每条学习者消息 45 个独立的 Choice 问题，在五个辅导结果标签中选择；另有一个二元 Noul 实验组，共 90 个问题。
  metrics:
    repo_stars: 35
  date: '2025-01-24'
  links:
    repo: https://github.com/freemocap/skellyspeak
  tags:
  - language-learning
  - assessment
  - benchmark
- name: Střední školy news classifier
  name_zh: Střední školy 新闻分类器
  url: https://github.com/tangero/stredniskoly/blob/main/scripts/novinky_jev.py
  kind: repo
  author: tangero
  description: Script behind a Czech site of secondary-school admission results that uses Jev to classify schools' news posts and decide which date in an announcement, such as an open day, is the event date.
  description_zh: 一个捷克中学升学录取结果网站背后的脚本，用 Jev 给各校新闻分类，并判断公告里的哪个日期才是活动日期（比如开放日）。
  jev: Per-date questions built from the post text, capped in number because accuracy drops as context grows; dates without a year are never asked.
  jev_zh: 根据帖子文本为每个日期构造问题，数量设有上限，因为上下文越长准确率越低；没写年份的日期从不提问。
  metrics:
    repo_stars: 5
  date: '2026-01-24'
  links:
    app: https://stredniskoly.vercel.app
    repo: https://github.com/tangero/stredniskoly
  tags:
  - czech
  - schools
  - classification
