- name: TeachAny PBL Jev recall
  name_zh: TeachAny 的 PBL Jev 召回
  url: https://github.com/weponusa/teachany-courseware/blob/main/scripts/pbl-jev-recall-flow.mjs
  kind: repo
  author: weponusa
  description: Recall step in the TeachAny courseware site's project-based-learning pipeline that asks Jev an independent Noul per curriculum item and drops candidates below 0.20 before the incumbent LLM judge picks the top 16.
  description_zh: TeachAny 课件网站项目式学习（PBL）流水线中的召回步骤：对每个课程条目向 Jev 问一个独立的 Noul，先剔除低于 0.20 的候选，再由现役 LLM 评委挑出前 16 个。
  metrics:
    repo_stars: 17
  date: '2026-05-09'
  links:
    repo: https://github.com/weponusa/teachany-courseware
  tags:
  - curriculum
  - pbl
  - filtering
- name: Universal History Simulator chronicle review
  name_zh: Universal History Simulator 的编年史审查
  url: https://github.com/benjaminbreen/UHS/blob/main/src/chronicle/review.ts
  kind: repo
  author: benjaminbreen
  description: Playthrough grader in the Universal History Simulator, an educational procedural history game, that asks Jev whether each recorded turn is anachronistic, uses outside knowledge, fits the character's role and what purpose it serves.
  description_zh: 教育类程序生成历史游戏 Universal History Simulator 中的通关记录评分器：就每个记录下来的回合询问 Jev 是否时代错置、是否用了游戏外的知识、是否符合角色身份，以及起什么作用。
  jev: 'Atomic questions per turn in parallel: anachronism and outside-knowledge Nouls, a 5-level plausibility Score and a purpose Choice.'
  jev_zh: 每个回合并行提一组原子问题：时代错置和外部知识两个 Noul、一个 5 级合理性 Score 和一个用途 Choice。
  metrics:
    repo_stars: 19
  date: '2025-08-01'
  links:
    repo: https://github.com/benjaminbreen/UHS
    app: https://historysimulator.vercel.app
  tags:
  - history
  - educational-game
  - grading
- name: Working Memory Jev (Passage)
  url: https://github.com/AustinAWay/Working-Memory-Jev
  kind: repo
  author: AustinAWay
  description: Experimental local teaching aid that shows educators where an instructional passage may ask learners to hold too many ideas or relationships at once as the text unfolds.
  description_zh: 实验性的本地教学辅助工具，向教师展示一篇教学文章在展开过程中，哪些地方可能要求学习者同时记住过多的概念或关系。
  jev: Jev proposes active idea groups, source connections, and changes in demand; the estimates are not validated measurements.
  jev_zh: Jev 提出活跃的概念组、来源关联和认知负荷变化；这些估计并非经过验证的测量结果。
  image: https://raw.githubusercontent.com/AustinAWay/Working-Memory-Jev/main/docs/provisional-estimates-live.png
  metrics:
    stars: 39
  date: '2026-09-18'
  links:
    demo: https://x.com/Austin_Way/status/2102131624921968704
  tags:
  - education
  - reading
  - cognitive-load
