- name: Exam question predictor
  name_zh: 考题预测器
  url: https://x.com/hametgholizadeh/status/2101289895624917076
  kind: post
  author: hametgholizadeh
  description: Ranks 80 real exam questions and 297 practice questions by how likely each is to appear on the actual exam, done in 80 seconds for $0.0256.
  description_zh: 按出现在真实考试中的可能性，给 80 道真题和 297 道练习题排序，用时 80 秒，花费 $0.0256。
  jev: Scores each practice question against the real exam set.
  jev_zh: 对照真题集给每道练习题打分。
  image: https://pbs.twimg.com/amplify_video_thumb/2101289673591021568/img/opei88xzp3DDGrcF.jpg
