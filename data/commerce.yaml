- name: Agent402 wish classifier
  name_zh: Agent402 的心愿分类器
  url: https://github.com/MikeyPetrillo/Agent402/blob/main/src/wish-classify.js
  kind: repo
  author: MikeyPetrillo
  description: Operator-side classifier in the Agent402 pay-per-call tool marketplace that asks Jev whether a wish-board row requests a capability or advertises a seller's endpoint. On 16 labeled rows adverts scored 0.84-0.95 and wishes 0.03-0.53.
  description_zh: 按次付费工具市场 Agent402 中运营方使用的分类器，询问 Jev 心愿板上的某一行是在求某项能力，还是卖家在推销自己的端点。在 16 条已标注的行上，广告得分 0.84-0.95，心愿得分 0.03-0.53。
  jev: One narrow Noul per row with a 0.75 threshold; it annotates rows only and never changes counts or qualification.
  jev_zh: 每行一个范围很窄的 Noul，阈值 0.75；只给行加注释，从不改变计数或资格判定。
