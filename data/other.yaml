- name: AI Relationship Copilot
  url: https://github.com/kingdsa/AI-Relationship-Copilot
  kind: repo
  author: kingdsa
  description: Chinese chat-reply assistant for romantic relationships in which Jev reads a partner's message for emotion, intensity, intent, relationship state and urgency and picks a reply strategy for an LLM to phrase.
