  jev: Noul, Choice and Score decisions in the emotion and strategy engines; without an LLM key a local composer builds the reply from Jev's outputs.
  jev_zh: 情绪引擎和策略引擎中使用 Noul、Choice 和 Score 决策；没有 LLM key 时，由本地组装器根据 Jev 的输出拼出回复。
